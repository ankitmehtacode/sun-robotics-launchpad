spring.application.name=demo

# --- DATABASE CONFIGURATION ---
# All values must be supplied via environment variables. No secrets are committed here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.minimum-idle=0
# How long a connection can sit idle before being closed (e.g., 2 minutes)
spring.datasource.hikari.idle-timeout=120000
# Maximum lifetime of a connection in the pool
spring.datasource.hikari.max-lifetime=300000

# JPA / Hibernate Settings
spring.jpa.show-sql=false
# Schema management: 'update' is convenient for dev but risky in prod (uncontrolled DDL on boot).
# Override with DDL_AUTO=validate (or none, once managed by migrations) in production environments.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT CONFIGURATION ---
# Must be a random string >= 32 bytes. Generate with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:864000000}

# --- CORS CONFIGURATION ---
# Comma-separated list of allowed origins. Override via env var per environment
# (e.g. just the prod domains in production; add localhost ports for local dev).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081,https://sunroboticsandai.in,https://www.sunroboticsandai.in}

server.port=${PORT:8080}
