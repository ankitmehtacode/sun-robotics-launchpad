    <!--
      Everything below, tagged data-static-fallback, is for crawlers that read

      main.tsx strips this whole block on hydrate so JS-executing crawlers and
      browsers never see both at once. Kept in sync with src/lib/schema.ts by
      hand since this file can't import it.
    -->
    <meta data-static-fallback name="description" content="Sun Robotics & AI builds industrial robotics, AI automation, and enterprise IT solutions — including website and app development — for businesses in Indore and across India." />
